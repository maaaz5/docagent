services:
  backend:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: docagent-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8123:8123"
    environment:
      # Connect to host's Ollama instance by default (or Ollama Cloud if set in .env)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      - COPILOTKIT_AGENT_MODEL=${COPILOTKIT_AGENT_MODEL:-qwen3:1.7b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      # LangSmith Tracing (optional)
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-docagent}
    volumes:
      # Persist vector database and SQLite conversation history on host
      - ./agent/chroma_db:/app/chroma_db
      - ./agent/threads.db:/app/threads.db
      - ./agent/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docagent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-to-server networking inside Docker network
      - AGENT_URL=http://backend:8123
      - BUCKET_API_URL=http://backend:8000
      # Browser client endpoint accessing published port on host
      - NEXT_PUBLIC_BUCKET_API_URL=http://localhost:8000
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: docagent-network

